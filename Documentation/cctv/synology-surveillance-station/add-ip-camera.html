:"DScam\/Android","text":"Android","children":[],"id":"SYNO.SDS.Application.DScam.Android"}]},{"uri":"LiveCam","text":"LiveCam","children":[{"uri":"LiveCam\/iPhone","text":"iOS","children":[],"id":"SYNO.SDS.Application.LiveCam.iPhone"},{"uri":"LiveCam\/Android","text":"Android","children":[],"id":"SYNO.SDS.Application.LiveCam.Android"}]}]}],"all_os_versions":{"DSM":{"text":"DiskStation Manager","versions":[{"version":"6","text":"DSM 6.2"},{"version":"7","text":"DSM 7.4"}]},"PAS":{"text":"DiskStation Manager Enterprise","versions":[]},"APM":{"text":"ActiveProtect","versions":[]},"SurveillanceStation":{"text":"Surveillance Station","versions":[{"version":"9","text":"Surveillance Station 9"},{"version":"8","text":"Surveillance Station 8"}]},"SRM":{"text":"Synology Router Manager","versions":[{"version":"1_3","text":"SRM 1.3"},{"version":"1_2","text":"SRM 1.2"}]},"DSMUC":{"text":"Unified Controller","versions":[]}},"content":"<h1 id=\"b_1\">Add an IP camera to Surveillance Station<\/h1>\n<img src=\"https:\/\/kb.synology.com\/helpfile\/SurveillanceStation\/8.2.11-6478\/SurveillanceStation\/images\/add_ipcamera\/concept.png\" width=\"640\" alt=\"\" id=\"b_3\" \/>\n<h2 id=\"b_5\">Overview<\/h2>\n<p id=\"b_7\">\n\tSurveillance Station is a security monitoring application that allows you to manage IP cameras to safeguard your home and office environments. To link your IP camera to Surveillance Station, you first need to make some simple settings.\n<\/p>\n\t\n\t\n<h3 class=\"list_head ol\" id=\"b_9\">1. Launch IP Camera<\/h3>\n<p id=\"b_11\">To launch <b>IP Camera<\/b>, do either of the following:<\/p>\n<ul id=\"b_13\">\n\t<li>Launch <b>Surveillance Station<\/b> and click <b>IP Camera<\/b>.<br \/>\n\t<img src=\"https:\/\/kb.synology.com\/helpfile\/SurveillanceStation\/8.2.11-6478\/SurveillanceStation\/images\/add_ipcamera\/figure01.png\" style=\"width: 100% !important; max-width: 640px !important\" alt=\"\" \/><\/li>\n\t<li>Launch <b>Surveillance Station<\/b> and go to <b>Main Menu<\/b> > <b>IP camera<\/b>.<br \/>\n\t<img src=\"https:\/\/kb.synology.com\/helpfile\/SurveillanceStation\/8.2.11-6478\/SurveillanceStation\/images\/add_ipcamera\/figure02.png\" style=\"width: 100% !important; max-width: 640px !important\" alt=\"\" \/><\/li>\n<\/ul>\n<h3 class=\"list_head\" id=\"b_15\">2. Add a camera<\/h3>\n<p id=\"b_17\">To add a camera to Surveillance Station, choose one of the following options:<\/p>\n<ul id=\"b_19\">\t\n\t<li>If there are no connected cameras, click <b>Add<\/b> in the dialogue to activate <b>Add Camera Wizard<\/b>.<\/li>\n\t<li>In the top-left corner, click <b>Add<\/b> > <b>Add Camera<\/b> to activate <b>Add Camera Wizard<\/b>.<br \/>\n\t<img src=\"https:\/\/kb.synology.com\/helpfile\/SurveillanceStation\/8.2.11-6478\/SurveillanceStation\/images\/add_ipcamera\/figure03.png\" style=\"width: 100% !important; max-width: 640px !important\" alt=\"\" \/><\/li>\n<\/ul>\n<h3 class=\"list_head\" id=\"b_21\">3. Set up the IP Camera<\/h3>\n<ol id=\"b_23\">\n\t<li>In <b>Add Camera Wizard<\/b>, choose between <b>Complete Setup<\/b> and <b>Quick Setup<\/b>. <b>Complete Setup<\/b> allows you to configure device information, video settings, recording settings, and schedule settings. With <b>Quick Setup<\/b>, you only need to set the necessary device information and can edit advanced settings in the <b>Advanced<\/b> page later.<br \/><img src=\"https:\/\/kb.synology.com\/helpfile\/SurveillanceStation\/8.2.11-6478\/SurveillanceStation\/images\/add_ipcamera\/figure04.png\" style=\"width: 100% !important; max-width: 640px !important\" alt=\"\" \/><\/li>\n\t<li>Select a server.<br \/><img src=\"https:\/\/kb.synology.com\/helpfile\/SurveillanceStation\/8.2.11-6478\/SurveillanceStation\/images\/add_ipcamera\/figure04.5.png\" style=\"width: 100% !important; max-width: 640px !important\" alt=\"\" \/><\/li><\/ol>\n\t\n\t<h4 id=\"b_25\">3.1 Set up the camera information<\/h4>\n\t\t<ol id=\"b_27\">\n\t\t\t<li>Under <b>Information<\/b>, click the <b>search<\/b> icon to the right of <b>IP address<\/b> to open the <b>Camera search result<\/b> window. Surveillance Station will automatically search for connectable devices in the domain.<br \/>\n\t\t\t<img src=\"https:\/\/kb.synology.com\/helpfile\/SurveillanceStation\/8.2.11-6478\/SurveillanceStation\/images\/add_ipcamera\/figure05.png\" style=\"width: 100% !important; max-width: 640px !important\" alt=\"\" \/><\/li>\n\t\t\t<li>Select a camera and click <b>OK<\/b>. The device <b>Name<\/b>, <b>IP address<\/b>, <b>Port<\/b>, <b>Brand<\/b>, <b>Camera model<\/b>, default <b>Username<\/b>\u00a0and\u00a0<b>Password<\/b><sup>1<\/sup>, and other settings will be loaded automatically. You can also enter your device information and let Surveillance Station help you with the default user name, password,\u00a0and other settings.<br \/>\n\t\t\t<img src=\"https:\/\/kb.synology.com\/helpfile\/SurveillanceStation\/8.2.11-6478\/SurveillanceStation\/images\/add_ipcamera\/figure06.png\" style=\"width: 100% !important; max-width: 640px !important\" alt=\"\" \/><\/li>\n\t\t\t<li>Some cameras also support\u00a0Firmware, TV standard, Mount type, Video channel, and UPnP functions. To use the functions, make sure to enable them on your camera first.<br \/>\n\t\t\t<img src=\"https:\/\/kb.synology.com\/helpfile\/SurveillanceStation\/8.2.11-6478\/SurveillanceStation\/images\/add_ipcamera\/figure07.png\" style=\"width: 100% !important; max-width: 640px !important\" alt=\"\" \/><\/li>\n\t\t\t<li>Finish the <b>Information<\/b> setting, and click <b>Test Connection<\/b> to make sure Surveillance Station is connected to your device<sup>2<\/sup>. If you are now connected to your device, a green check will appear and you can see the live feed in the box to the right<sup>3<\/sup>.<br \/>\n\t\t\t<img src=\"https:\/\/kb.synology.com\/helpfile\/SurveillanceStation\/8.2.11-6478\/SurveillanceStation\/images\/add_ipcamera\/figure08.png\" style=\"width: 100% !important; max-width: 640px !important\" alt=\"\" \/><\/li>\n\t\t\t<li>If you chose <b>Complete Setup<\/b>, more video settings will be shown in the next page. If you chose <b>Quick Setup<\/b>, Surveillance Station will complete the action with default settings.<\/li>\n\t\t<\/ol>\n\t\t\n\t\t\t\t\n\t<h4 id=\"b_29\">3.2 Set up video settings<\/h4>\n\t\t<p id=\"b_31\">Adjust the <b>Video format<\/b>, <b>Audio format<\/b>, <b>Streaming profile<\/b>, <b>Resolution<\/b>, <b>Frame rate<\/b>, <b>Bitrate control<\/b>, and <b>Image quality<\/b><sup>4<\/sup>. Depending on the camera, up to three streams can be set up simultaneously.<br \/>\n\t\t    <img src=\"https:\/\/kb.synology.com\/helpfile\/SurveillanceStation\/8.2.11-6478\/SurveillanceStation\/images\/add_ipcamera\/figure09.png\" style=\"width: 100% !important; max-width: 640px !important\" alt=\"\" \/>\n\t\t<\/p>\n\t\n\t<h4 id=\"b_33\">3.3 Set up recording settings<\/h4>\n\t\t<p id=\"b_35\">Adjust the <b>Pre-recording time before an event<\/b> and <b>Post-recording time after an event<\/b>. You can configure <b>Keep the files within (days) <\/b>and <b>Limit the archive folder up to (GB)<\/b> to manage recordings, and set up <b>Customize archive folder names<\/b>, <b>Customize file name prefix<\/b>, and <b>Recording storage<\/b>.<br \/>\n\t\t    <img src=\"https:\/\/kb.synology.com\/helpfile\/SurveillanceStation\/8.2.11-6478\/SurveillanceStation\/images\/add_ipcamera\/figure10.png\" style=\"width: 100% !important; max-width: 640px !important\" alt=\"\" \/>\n\t\t<\/p>\n\t<h4 id=\"b_37\">3.4 Set up a schedule<\/h4>\n\t<ol id=\"b_39\">\n\t\t<li>Determine what time to start continuous recording and what time to enable event detection<sup>5<\/sup>.<br \/><\/li>\n\t\t<li>Click on the boxes above the timetable to choose a recording mode, and drag your mouse across the timetable to apply the settings.<br \/>\n\t\t<img src=\"https:\/\/kb.synology.com\/helpfile\/SurveillanceStation\/8.2.11-6478\/SurveillanceStation\/images\/add_ipcamera\/figure11.png\" style=\"width: 100% !important; max-width: 640px !important\" alt=\"\" \/><\/li>\n\t\t<li>Click <b>Finish<\/b>. Surveillance Station will try to set up the camera accordingly.<br \/>\t<\/li>\n\t<\/ol>\t\n\t\n<h3 class=\"list_head\" id=\"b_41\">4. Make sure the camera is set up correctly<\/h3>\t\n<p id=\"b_43\">Once settings are complete, cameras will appear in the list with their status shown after the device name.<\/p>\n<ul id=\"b_45\">\n <li>It may take up to minutes for Surveillance Station to set up and connect to the camera. Meanwhile, the status will be \"<b>Activating<\/b>\".<\/li>\n <li>If Surveillance Station cannot connect to your camera and obtain video streams, the status will read \"<b>Disconnected<\/b>\" and prompt possible reasons.<\/li>\n <li>If the camera is later connected, the prompt will be hidden while the video stream thumbnail appears. Click the thumbnail to access your camera and play the footage.<\/li>\n<\/ul>\n<p id=\"b_47\">_____<br \/> \n<sup style=\"color: #990000;\">1<\/sup> Always load the default username and password. If the username or password is changed, Surveillance Station may not be able to find your camera.<br \/>\n<sup style=\"color: #990000;\">2<\/sup> Even if the test connection is successful, some cameras may not function properly. See <a href=\"https:\/\/www.synology.com\/en-us\/knowledgebase\/Surveillance\/tutorial\/Camera\/Why_my_camera_still_does_not_work_properly_even_when_Test_Connection_was_successful_during_the_setup\" target=\"_blank\">this article<\/a> for more information.<br \/>\n<sup style=\"color: #990000;\">3<\/sup> Some cameras do not provide snapshots, so snapshots may not be displayed properly.<br \/>\n<sup style=\"color: #990000;\">4<\/sup> If <b>Bitrate control<\/b> is set as <b>Variable<\/b>, you can choose the <b>Image quality<\/b> you want. If <b>Bitrate control<\/b> is set as <b>Constant<\/b>, you can adjust the bit rate.<br \/>\n<sup style=\"color: #990000;\">5<\/sup> After setting up your IP Camera, you can find <b>Event detection<\/b> and <b>I\/O Port<\/b> in the left panel and edit settings.<br \/>\n_____<\/p>\n<div class=\"page-info\" id=\"b_49\">\n<ul>\n\t<li>Next in this topic: <a href=\"\/en-us\/SurveillanceStation\/help\/SurveillanceStation\/Tutorial\/recording_event_detection?version=8\">Set up Event Detection and view recordings<\/a> <\/li>\n<\/ul>\n<\/div><link rel=\"stylesheet\" href=\"\/css\/feedback_form\/feedback_form_web.css\" \/>\n\n<div class=\"feedBackForm feedBackForm--noiframe clearfix en-us\" style=\"opacity: 0;\">\n    <div class=\"clearfix\">\n        <!-- Begin page content -->\n        <div id=\"main\" class=\"SurveillanceStation\">\n            <div class=\"feedback_form\">\n                <form id=\"feedback_form\" class=\"feedback_form_class\" action=\"https:\/\/kb.synology.com\/en-us\/feedback\" method=\"POST\">\n                    <div id=\"form_option\" class=\"form_option_class\" style=\"display:none;\" >\n                        <!-- option when selected no -->\n\n                        <div class=\"button_no\">\n                            <div class=\"center\" style=\"text-align:left;margin-top:3px;\">\n                                <p class=\"button_no_title\">Please tell us why the article wasn't helpful:<\/p>\n\n                                                                <div class=\"checkbox_group\">\n                                    <input class=\"checkbox\" type=\"button\">\n                                    <input name=\"reason\" type=\"checkbox\" value=\"complicated\">\n                                    <span>Too technical<\/span>\n                                <\/div>\n                                                                <div class=\"checkbox_group\">\n                                    <input class=\"checkbox\" type=\"button\">\n                                    <input name=\"reason\" type=\"checkbox\" value=\"incorrect\">\n                                    <span>Incorrect instructions<\/span>\n                                <\/div>\n                                                                <div class=\"checkbox_group\">\n                                    <input class=\"checkbox\" type=\"button\">\n                                    <input name=\"reason\" type=\"checkbox\" value=\"not_enough\">\n                                    <span>Not enough information<\/span>\n                                <\/div>\n                                                                <div class=\"checkbox_group\">\n                                    <input class=\"checkbox\" type=\"button\">\n                                    <input name=\"reason\" type=\"checkbox\" value=\"typo\">\n                                    <span>Spelling or grammar mistakes<\/span>\n                                <\/div>\n                                \n                                <div class=\"options_other\">\n                                    <p>Do you have any other feedback for this article?<\/p>\n                                    <textarea name=\"otherFeedback\" id=\"otherFeedback\" cols=\"45\" rows=\"5\"><\/textarea>\n                                <\/div>\n\n                                <div id='last_buttons'>\n                                    <input class=\"feedback_form_button_style button_submit_class\" style=\"width:auto;\" id=\"button_submit\" name=\"useful1\" type=\"button\" value=\"Submit\">\n                                    <input class=\"feedback_form_button_style button_cancel_class\" style=\"width:auto;\" id=\"button_cancel\" name=\"useful1\" type=\"button\" value=\"Cancel\">\n                                <\/div>\n\n                                <span class=\"empty_reason_errmsg\" style=\"display:none;\">Please select at least one reason.<\/span>\n                            <\/div>\n                        <\/div>\n                    <\/div>\n\n                    <div id=\"form_yes_no\" class=\"form_yes_no_class\">\n                                                <!-- yes no radio button & send -->\n                        Was this article helpful?\n                        &nbsp;\n                        <p style=\"display: inline-block; margin: 0; padding: 0;\">\n                            <span class=\"yes\"><a id=\"button_yes\" class=\"button_yes_class\" href=\"javascript:void(0)\">Yes<\/a><\/span>\n                            \uff0f\n                            <span><a id=\"button_no\" class=\"button_no_class\" href=\"javascript:void(0)\">No<\/a><\/span>\n                        <\/p>\n                    <\/div>\n\n                    <div id=\"form_thank_you\" class=\"form_thank_you_class\" style=\"display:none;\">\n                        <!-- yes no radio button & send -->\n                        <div>\n                            <p style=\"margin:0px;\">Thank you for the feedback!<\/p>\n                        <\/div>\n                    <\/div>\n                <\/form>\n\n                <input type=\"hidden\" name=\"web_site\" value=\"https:\/\/kb.synology.com\">\n                                <input type=\"hidden\" name=\"queryString\" value=\"mode=web&type=help&section=SurveillanceStation&version=8.2.11-6478&lang=enu&link=Tutorial%2Fadd_ipcamera&is_svs=1\">\n                            <\/div>\n        <\/div>\n\n        <div id=\"mask\" style=\"display: none;\"><\/div>\n    <\/div>\n\n    <template id=\"tmpl-loading-msg\"><i class=\"fa fa-refresh fa-spin\"><\/i> Loading...<\/template>\n<\/div>\n","platforms":[],"params":{"os":"SurveillanceStation","version":"8","uri":"SurveillanceStation\/Tutorial\/add_ipcamera"},"meta":{"title":"Install your IP camera on Surveillance Station | Get Started With Surveillance Station - Synology Knowledge Center","description":"Synology Knowledge Center offers comprehensive support, providing answers to frequently asked questions, troubleshooting steps, software tutorials, and all the technical documentation you may need."},"pdf_link":null}},

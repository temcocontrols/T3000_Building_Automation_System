    <script defer>
	(function() {
		var vm = DOM_VUE.createApp({
			el: "#root",
			data: {"sidebar_enabled":true,"sidebar_active":false,"sidebar_only_search":false,"preload":{"doc_type":"UG","chapter":"11","tree":[{"uri":"UG\/Surveillance_Station_User_Guide_9\/1","text":"Get Started with Surveillance Station"},{"uri":"UG\/Surveillance_Station_User_Guide_9\/2","text":"Deploy IP Cameras"},{"uri":"UG\/Surveillance_Station_User_Guide_9\/3","text":"Monitor Camera Feeds"},{"uri":"UG\/Surveillance_Station_User_Guide_9\/4","text":"Manage Video Recordings"},{"uri":"UG\/Surveillance_Station_User_Guide_9\/5","text":"Work with I\/O Modules"},{"uri":"UG\/Surveillance_Station_User_Guide_9\/6","text":"Notification"},{"uri":"UG\/Surveillance_Station_User_Guide_9\/7","text":"Action Rules"},{"uri":"UG\/Surveillance_Station_User_Guide_9\/8","text":"Archive Vault"},{"uri":"UG\/Surveillance_Station_User_Guide_9\/9","text":"License"},{"uri":"UG\/Surveillance_Station_User_Guide_9\/10","text":"CMS"},{"uri":"UG\/Surveillance_Station_User_Guide_9\/11","text":"Additional Features"}],"content":"<h1 class=\"hig_accordion_h1\"><a id=\"x_anchor_id5bfcc775d4\"><\/a>Additional Features<\/h1>\n  <div class=\"hig_accordion_container\">\n    <p>Surveillance Station also provides various applications to manage and integrate surveillance features such as recording, notification, stream profile, and action rules efficiently. This chapter introduces some functions to enhance your monitoring experience.<\/p>\n    <div class=\"hig_accordion\">\n      <h2 class=\"hig_accordion_title\"><a id=\"x_anchor_id75a7c0cb9c\"><\/a>Home mode<\/h2>\n      <div class=\"hig_accordion_content\">\n        <div>\n          <p>In <strong>Surveillance Station<\/strong> &gt; <strong>Home Mode<\/strong>, you can customize recording, notification, stream profile, and action rule settings depending on whether or not you are on site.<br><img src=\"..\/..\/..\/docs_images\/UG\/Syno_UserGuide_SurveillanceStation\/39.png\" style=\"width: 800px;\" class=\"img_border\" alt=\"39.png\"><\/p>\n          <p>To switch to Home Mode manually, go to <strong>Overview<\/strong> &gt; and enable the toggle next to <strong>Status<\/strong>.<\/p>\n          <p class=\"margin_top_1\">To switch to Home Mode using geofencing, download and sign in to the DS cam application on your mobile device. On the <strong>Home Mode<\/strong> page, you can <a href=\"https:\/\/kb.synology.com\/SurveillanceStation\/help\/DScam\/iPhone?version=9\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">configure Auto Switch<\/a>, which will allow you to switch to <strong>Home Mode<\/strong> automatically when your mobile device enters the Home location or connects to the Home Wi-Fi.<\/p>\n          <p class=\"margin_top_1\">You can also switch to Home Mode by schedule or perform a one-time switch at a specified time in <strong>Home Mode<\/strong> &gt; <strong>Schedule<\/strong>.<\/p>\n          <p class=\"margin_top_1\">In <strong>Home Mode<\/strong> &gt; <strong>Settings<\/strong>, you can modify <strong>Recording<\/strong>, <strong>Notification<\/strong>, <strong>Stream Profile<\/strong>, and <strong>Action Rule<\/strong> from the corresponding tabs, and select which set of settings to enable and what devices to apply them to<\/p>\n          <p class=\"margin_top_1\">For more information on Home Mode, refer to Surveillance Station Help &gt; <a href=\"https:\/\/kb.synology.com\/SurveillanceStation\/help\/SurveillanceStation\/home_mode?version=9\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">Home Mode<\/a>.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"hig_accordion\">\n      <h2 class=\"hig_accordion_title\"><a id=\"x_anchor_idaf51fdf94a\"><\/a>Maps<\/h2>\n      <div class=\"hig_accordion_content\">\n        <div>\n          <p><strong>Surveillance Station<\/strong> &gt; <strong>Maps<\/strong> allows you to set up an interactive map where you can visualize your environments, achieve a seamless viewing experience, and automatically track security events across multiple locations.<br><img src=\"..\/..\/..\/docs_images\/UG\/Syno_UserGuide_SurveillanceStation\/40.png\" style=\"width: 800px;\" class=\"img_border\" alt=\"40.png\"><\/p>\n          <p>Sources for a map can either be an image map you upload, through a map service such as OpenStreetMap, Google Map, or a tile server. <\/p>\n          <p class=\"margin_top_1\">o create an image map, click the + button on the top-right corner of <strong>Image Maps<\/strong>. If you want to use a map from a map service, click on <strong>Map Service<\/strong> &gt; <strong>Enable map service<\/strong>.<\/p>\n          <p class=\"margin_top_1\">Once a map is created, click on <strong>Edit<\/strong> to <a href=\"https:\/\/kb.synology.com\/SurveillanceStation\/help\/SurveillanceStation\/maps_edit?version=9\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">add<\/a> objects, maps, or map groups from their relevant panels to the desired location on the current map. Objects may include network cameras, I\/O modules, doors, transaction devices, and network speakers that have already been added to Surveillance Station.<\/p>\n          <p class=\"margin_top_1\">Once a map is complete, it can be used in the <strong>Monitoring Center<\/strong> to track alerts from relevant devices at locations displayed on the map.<\/p>\n          <p class=\"margin_top_1\">For more information about <strong>Maps<\/strong>, go to Surveillance Station Help &gt; <a href=\"https:\/\/kb.synology.com\/SurveillanceStation\/help\/SurveillanceStation\/maps?version=9\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">Maps<\/a>.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"hig_accordion\">\n      <h2 class=\"hig_accordion_title\"><a id=\"x_anchor_idd4e2713d1b\"><\/a>Snapshot<\/h2>\n      <div class=\"hig_accordion_content\">\n        <div>\n          <p><strong>Surveillance Station<\/strong> &gt; <strong>Snapshot<\/strong> allows you to track and edit all the snapshots taken from players (e.g., Live View, Recording, or IP Camera) in Surveillance Station.<br><img src=\"..\/..\/..\/docs_images\/UG\/Syno_UserGuide_SurveillanceStation\/41.png\" style=\"width: 800px;\" class=\"img_border\" alt=\"41.png\"><\/p>\n          <p>In <strong>Snapshot<\/strong> &gt; <strong>List<\/strong>, you can view the snapshots taken in Surveillance Station players. Select one or more snapshots to <strong>Edit<\/strong> them.<\/p>\n          <p class=\"margin_top_1\">The <strong>Advanced<\/strong> page provides options for you to configure the sorting, naming, display, and archive rules of snapshots.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"hig_accordion\">\n      <h2 class=\"hig_accordion_title\"><a id=\"x_anchor_idce0be71e33\"><\/a>Log<\/h2>\n      <div class=\"hig_accordion_content\">\n        <div>\n          <p><strong>Surveillance Station<\/strong> &gt; <strong>Log<\/strong> allows you to view, archive, and manage logs and track everything that occurred in Surveillance Station. <br><img src=\"..\/..\/..\/docs_images\/UG\/Syno_UserGuide_SurveillanceStation\/42.png\" style=\"width: 800px;\" class=\"img_border\" alt=\"42.png\"><\/p>\n\n          <p><strong>System Log<\/strong> allows you to view and manage logs of all Surveillance Station system operations, e.g., user logins, camera connections, recording storage changes, and application statutes.<\/p>\n          <p class=\"margin_top_1\"><strong>Event Log<\/strong> allows you to view all camera logs, I\/O module, Face Recognition, and Deep Video Analytics events and playback the corresponding recordings directly.<\/p>\n          <p class=\"margin_top_1\">Both types of logs allow you to <strong>Clear<\/strong> existing logs or <strong>Download<\/strong> them.<\/p>\n          <p class=\"margin_top_1\">The rotation and archive rules of the logs can be modified on the <strong>Archive Settings<\/strong> page. <br><img src=\"..\/..\/..\/docs_images\/UG\/Syno_UserGuide_SurveillanceStation\/43.png\" style=\"width: 800px;\" class=\"img_border\" alt=\"43.png\"><\/p>\n          <p>If you wish to save your logs to a syslog server, go to the <strong>Log Sending<\/strong> page, select <strong>Send logs to a syslog server<\/strong>, and enter the required information.<\/p>\n          <p class=\"margin_top_1\">For more information, please refer to Surveillance Station Help &gt; <a href=\"https:\/\/kb.synology.com\/SurveillanceStation\/help\/SurveillanceStation\/log?version=9\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">Log<\/a>.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>","meta":{"title":"Surveillance Station User's Guide","description":"Synology Knowledge Center offers comprehensive support, providing answers to frequently asked questions, troubleshooting steps, software tutorials, and all the technical documentation you may need."},"pdf_link":"https:\/\/global.download.synology.com\/download\/Document\/Software\/UserGuide\/Package\/SurveillanceStation\/9.0\/enu\/Surveillance_Station_User_Guide_9_enu.pdf","subtitle":"Version 9.0"}},
		});
	})();
</script>

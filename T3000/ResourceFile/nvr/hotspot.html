<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>T3000 CCTV - Hotspot map</title>
  <style>
    html,body{margin:0;height:100%;background:#0a1220;color:#e8eef5;font:13px Segoe UI,Tahoma,sans-serif}

    header a{color:#9ec9f0}
    #wrap{display:flex;height:calc(100% - 52px)}
    #map{display:block;flex:1;background:#0a1220}
    #events{width:280px;border-left:1px solid #1e3348;padding:10px 12px;overflow:auto}

    #events li{margin:0 0 8px;padding:6px 0;border-bottom:1px solid #1e3348;list-style:none}
    #events ul{margin:0;padding:0}
    #events a{color:#9ec9f0}
    .muted{color:#8aa0b5}
  </style>
</head>

      <div id="ev-status" class="muted">Checking localhost recorder.</div>
      <ul id="ev-list"></ul>
    </aside>
